name: Hero V3 source snapshot

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pack source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf "$RUNNER_TEMP/hero-v3-source.tgz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hero-v3-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hero-v3-source.tgz
          if-no-files-found: error
          retention-days: 1
