name: Hero V3 deterministic finalizer

on:
  push:
    branches: [feature/hero-motion-v3]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Hero V3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/hero-motion-v3
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore validated Hero V3 final files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hero-v3-final-files.tgz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/hero-v3-final-files.tgz.b64 > /tmp/hero-v3-final-files.tgz
          echo '0b68f123e0158c093cf71a2305ad0faa07f5f927753f4ad27a9a38d3f3378a18  /tmp/hero-v3-final-files.tgz' | sha256sum -c -
          tar -xzf /tmp/hero-v3-final-files.tgz -C .
          git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate final Hero V3 files
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          node --check tools/hero-motion-browser-smoke.mjs
          node tools/check-hero-accessibility.mjs
          node tools/check-admin-accessibility.mjs
          node tools/check-admin-touch-contract.mjs
          node tools/check-home-editorial.mjs
          node tools/check-admin-persistent-save.mjs

      - name: Remove temporary Hero V3 infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/hero-v3-finalize.yml \
            .github/workflows/hero-v3-source-snapshot.yml \
            hero-v3-note.txt
          git diff --check

      - name: Commit final Hero V3 head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/home/HeroSection.tsx \
            src/components/home/HeroSection.module.css \
            src/components/admin/HomeHeroEditor.module.css \
            tools/check-home-editorial.mjs \
            tools/check-hero-accessibility.mjs \
            tools/hero-motion-browser-smoke.mjs
          git commit -m 'Hero V3: finalize runtime, tests and visual contract'
          git push origin HEAD:feature/hero-motion-v3
